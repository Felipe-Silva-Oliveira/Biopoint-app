name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer and Fixed Python-for-Android
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3-virtualenv
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer
          pip install git+https://github.com

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.3.0

          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Pre-accept Android Licenses and Build
        run: |
          # 1. Cria a pasta padrão onde o Buildozer vai estruturar o SDK
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin || true
          
          # 2. Executa uma ferramenta nativa do Buildozer para forçar o download inicial do SDK básico
          buildozer android debug || true
          
          # 3. Força o aceite de TODAS as licenças diretamente no gerenciador oficial do SDK do Android
          if [ -d "/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools" ]; then
            yes | find /home/runner/.buildozer/android/platform/android-sdk/ -name "sdkmanager" -exec {} --licenses \; || true
          fi

          # 4. Agora roda a compilação real com o ambiente 100% licenciado e aprovado
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
