name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3-virtualenv
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.3.0

          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Build APK with Dynamic License Injection
        run: |
          # 1. Inicia o buildozer. Ele vai baixar o SDK da Google e falhar na checagem inicial da licença
          buildozer android debug || true
          
          # 2. Localiza o sdkmanager e injeta as licenças limpando os argumentos via xargs
          echo "Injetando aceitação de licenças..."
          find /home/runner/.buildozer/android/platform/ -name "sdkmanager" -type f | xargs -I {} sh -c 'yes | {} --licenses' || true
          
          # 3. Força explicitamente a instalação do pacote build-tools e aidl que estavam faltando
          find /home/runner/.buildozer/android/platform/ -name "sdkmanager" -type f | head -n 1 | xargs -I {} sh -c 'yes | {} "build-tools;33.0.2" "platforms;android-33"' || true
          
          # 4. Roda o buildozer novamente com o ecossistema totalmente liberado e licenciado
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
