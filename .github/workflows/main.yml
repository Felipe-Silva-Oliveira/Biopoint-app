name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3-virtualenv
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.3.0

          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Pre-accept Android Licenses and Build
        run: |
          # 1. Executa o buildozer em segundo plano por apenas 45 segundos para ele baixar a pasta do SDK e criar as ferramentas
          timeout 45s buildozer android debug || true
          
          # 2. Responde "y" (sim) automaticamente para todas as licenças oficiais da Google direto no sdkmanager recém-baixado
          # Isso instala o Aidl e as build-tools sem gerar o erro de Broken pipe
          yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 3. Roda a compilação real com o ambiente totalmente licenciado
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
