name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.3.0

          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Build APK inside custom environment
        run: |
          # Usamos uma imagem oficial do Ubuntu e instalamos o buildozer manualmente sem travas de root
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 /bin/bash -c "
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3 python3-pip python3-venv && \
              pip3 install --upgrade pip && \
              pip3 install 'cython>=0.29.33,<3.0.0' buildozer virtualenv && \
              # Injetamos a resposta 'y' diretamente por um cano contínuo para burlar qualquer prompt interativo
              yes | buildozer --warntoroot android debug
            "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
