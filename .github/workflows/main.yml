name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3-virtualenv
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.3.0

          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Build APK with Dynamic License Injection
        run: |
          # 1. Inicia o buildozer. Ele vai baixar o SDK da Google e falhar na checagem inicial da licença
          buildozer android debug || true
          
          # 2. Varre o sistema para encontrar o local exato onde o sdkmanager foi extraído
          SDKMANAGER_PATH=$(find /home/runner/ -name "sdkmanager" -type f | head -n 1)
          
          # 3. Se encontrar o gerenciador, injeta a aprovação automática de todas as licenças
          if [ ! -z "$SDKMANAGER_PATH" ]; then
            echo "Gerenciador do SDK encontrado em: $SDKMANAGER_PATH"
            yes | $SDKMANAGER_PATH --licenses || true
          else
            echo "Aviso: sdkmanager não foi encontrado na primeira passagem."
          fi
          
          # 4. Roda o buildozer novamente; agora as licenças já estarão gravadas no disco do servidor
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
