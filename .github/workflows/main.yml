name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.1.0

          android.api = 31
          android.minapi = 21
          android.ndk = 23b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Build APK inside Legacy Environment
        run: |
          # Usamos uma imagem antiga e estável que suporta nativamente a flag --ignore-setup-py
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:18.04 /bin/bash -c "
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y git zip unzip openjdk-8-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev python3 python3-pip python3-setuptools && \
              pip3 install --upgrade 'pip<20.0' && \
              pip3 install 'cython>=0.29.33,<3.0.0' 'buildozer==1.4.0' && \
              yes | buildozer --warntoroot android debug
            "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
