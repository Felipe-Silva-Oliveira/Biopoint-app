name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Buildozer and Downgrade Pip
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev gawk libffi-dev
          # O segredo está aqui: rebaixar o pip para uma versão que aceita os comandos clássicos do Buildozer
          pip install --upgrade "pip<23.0"
          pip install --upgrade "cython>=0.29.33,<3.0.0" "buildozer==1.5.0" virtualenv

      - name: Create buildozer.spec automatically
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Bio Point
          package.name = biopoint
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt
          version = 0.1
          requirements = python3,kivy==2.2.1

          android.api = 31
          android.minapi = 21
          android.ndk = 23b
          orientation = portrait
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 1
          warn_on_root = 0
          EOF

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BioPoint-APK
          path: bin/*.apk
